<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>Parameter Selection</title>
</head>

<body>
    <div class="headingBanner">
        <h1>Battery Simulation Parameters</h1>
    </div>
    <div class="container">
        <form action="/result/" method="POST">
            <table>
            {% csrf_token %}
            {{ form.as_table }}
            </table>
            <button>Submit</button>
        </form>
    </div>

    <table class="table_simulation_parameters">
        <tr>
            <th>Parameter Name</th><th id="th_parameter_name"></th>
        </tr>
        <tr>
            <th>Initial Positive Electrode SOC</th><th id="th_soc_p_init"></th>
        </tr>
        <tr>
            <th>Initial Negative Electrode SOC</th><th id="th_soc_n_init"></th>
        </tr>
    </table>

    <script src="{% static 'index.js' %}"></script>
</body>
</html>
